<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Forms</title>
</head>

<body>

    <!-- Registration Form -->

    <h2>Student Registration Form</h2>

    <form action="#" method="post">

        <label>Full Name:</label><br>
        <input type="text" name="name" required>

        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label><br>
        <input type="password" name="pwd" required>

        <br><br>

        <label>Gender:</label>

        <input type="radio"
               name="gender"
               value="M">
        Male

        <input type="radio"
               name="gender"
               value="F">
        Female

        <br><br>

        <label>Courses:</label>

        <input type="checkbox"
               name="course"
               value="web">
        Web Technology

        <input type="checkbox"
               name="course"
               value="dbms">
        DBMS

        <br><br>

        <label>Date of Birth:</label>

        <input type="date" name="dob">

        <br><br>

        <label>Country:</label>

        <select name="country">
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
        </select>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Clear">

    </form>


    <hr>


    <!-- Login Form -->

    <h2>Student Login</h2>

    <form action="#" method="post">

        <label>Username:</label><br>

        <input type="text"
               name="username"
               required>

        <br><br>

        <label>Password:</label><br>

        <input type="password"
               name="password"
               required>

        <br><br>

        <input type="submit" value="Login">

    </form>


    <hr>


    <!-- Feedback Form -->

    <h2>Feedback Form</h2>

    <form action="#" method="post">

        <label>Name:</label><br>

        <input type="text" name="name">

        <br><br>

        <label>Rate our service:</label>

        <select name="rating">

            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>

        </select>

        <br><br>

        <label>Comments:</label><br>

        <textarea
            name="comments"
            rows="4"
            cols="40">
        </textarea>

        <br><br>

        <input type="submit"
               value="Submit Feedback">

    </form>

</body>
</html>
